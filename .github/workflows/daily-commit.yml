name: Daily GitHub Contribution Bot

on:
  schedule:
    # 21:20 UTC matches 10:20 PM local time
    - cron: '20 21 * * *'
  workflow_dispatch:

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Contribution Log
        run: |
          echo "Last contribution update: $(date)" > contribution-log.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add contribution-log.txt
          git commit -m "chore: automated daily contribution log update"
          git push
