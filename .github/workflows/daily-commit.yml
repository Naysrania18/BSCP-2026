name: Daily GitHub Contribution Bot

on:
  schedule:
    # This runs the job every day at 12:00 AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the bot anytime to test it

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Make a change to a file (updates the log with the current date)
      - name: Update Contribution Log
        run: |
          echo "Last contribution update: $(date)" > contribution-log.txt

      # Step 3: Commit and Push changes back to GitHub
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add contribution-log.txt
          git commit -m "chore: automated daily contribution log update"
          git push
